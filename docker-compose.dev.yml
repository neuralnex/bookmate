version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres:
    image: postgres:16-alpine
    container_name: bookmate-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmate_password}
      POSTGRES_DB: ${POSTGRES_DB:-bookmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmate_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookmate-dev-network
    restart: unless-stopped

  # Bookmate API Application (Development with hot reload)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bookmate-api-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL}
      MONNIFY_CALLBACK_URL: ${MONNIFY_CALLBACK_URL}
      MONNIFY_RETURN_URL: ${MONNIFY_RETURN_URL}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookmate-dev-network
    restart: unless-stopped
    command: npm run dev

networks:
  bookmate-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local

